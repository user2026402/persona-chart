name: unpack-site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f site.zip ]; then
            unzip -o site.zip -d .
            rm -f site.zip
          else
            echo "no site.zip"
          fi
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "unpack-site: commit site files" || echo nothing-to-do
          git push
